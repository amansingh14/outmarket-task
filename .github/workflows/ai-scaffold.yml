# Generative IaC: a short service spec -> deployable Helm values, opened as a pull request.
#
#   1. commit services/<name>.yaml (name, port, language, expected load, public?)
#   2. Actions -> "AI: scaffold service" -> spec=services/<name>.yaml
#
# Claude designs sizing, probes and scaling; guardrails clamp it (private unless the spec says
# public, no secrets in env, limits >= requests); a renderer writes values for deploy/helm/microservice,
# and CI lints the chart with the new values before anyone merges.
name: "AI: scaffold service"

on:
  workflow_dispatch:
    inputs:
      spec:
        description: Path to the service spec
        type: string
        default: services/notifier.yaml

permissions:
  contents: write
  pull-requests: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: development
          token: ${{ secrets.PROMOTION_TOKEN || github.token }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --quiet ./ai
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.3
      - name: Design and render
        id: s
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SPEC: ${{ inputs.spec }}
        run: |
          case "$SPEC" in services/*.yaml) ;; *) echo "::error::spec must be services/<name>.yaml"; exit 1;; esac
          devops-ai --summary "$RUNNER_TEMP/body.md" scaffold-service --spec "$SPEC"
      - name: Lint the generated values against the chart
        run: |
          helm lint deploy/helm/microservice -f "${{ steps.s.outputs.values }}"
          helm template "${{ steps.s.outputs.service }}" deploy/helm/microservice -f "${{ steps.s.outputs.values }}" > /dev/null
      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_TOKEN || github.token }}
          SERVICE: ${{ steps.s.outputs.service }}
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then echo "no changes"; exit 0; fi
          branch="chore/scaffold-$SERVICE-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add deploy/helm/values/services
          git commit -m "Scaffold $SERVICE deployment values"
          git push -u origin "$branch"
          gh pr create --base development --head "$branch" --title "Scaffold $SERVICE (AI proposal)" --body-file "$RUNNER_TEMP/body.md"
