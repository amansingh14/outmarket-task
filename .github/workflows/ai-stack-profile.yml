# Dynamic environment configuration: describe a goal, get a reviewed pull request.
#
#   Actions -> "AI: stack profile" -> stack=nonprod, goal="cheapest shared non-prod under $150/month"
#
# Claude proposes cloud-neutral sizing; code enforces guardrails (e.g. production is always HA and
# deletion-protected) and prices it per cloud from clouds/<name>/cloud.yaml; the result is opened as a
# PR into development, where the Terraform compliance gate checks the planned infrastructure.
name: "AI: stack profile"

on:
  workflow_dispatch:
    inputs:
      stack:
        description: Stack to (re)size
        type: choice
        options: [nonprod, preprod, production]
      goal:
        description: What you need, in plain words (budget, availability, load, ...)
        type: string
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: development
          token: ${{ secrets.PROMOTION_TOKEN || github.token }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --quiet ./ai
      - name: Propose profile
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STACK: ${{ inputs.stack }}
          GOAL: ${{ inputs.goal }}
        run: devops-ai --summary "$RUNNER_TEMP/body.md" stack-profile --stack "$STACK" --goal "$GOAL"
      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_TOKEN || github.token }}
          STACK: ${{ inputs.stack }}
          GOAL: ${{ inputs.goal }}
        run: |
          if git diff --quiet; then echo "profile unchanged; nothing to propose" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          branch="chore/stack-profile-$STACK-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Resize $STACK stack: $GOAL"
          git push -u origin "$branch"
          { echo "**Goal:** $GOAL"; echo; cat "$RUNNER_TEMP/body.md"; } > "$RUNNER_TEMP/pr.md"
          gh pr create --base development --head "$branch" --title "Resize $STACK stack (AI proposal)" --body-file "$RUNNER_TEMP/pr.md"
