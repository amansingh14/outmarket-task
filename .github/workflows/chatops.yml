# ChatOps on pull requests: AI-assisted command generation, guarded by an allow-list.
#
#   /deploy-preview [cloud] [N replicas]   build this PR's images, deploy preview-pr-<N> (embedded DB)
#   /teardown-preview                      remove the preview
#   /ai <question or request>              e.g. "/ai why is the preview backend restarting?"
#
# Claude turns the comment into a typed plan of kubectl/helm steps; ai/devops_ai/command_policy.py
# validates every step (only preview-* may be mutated, no shell, no exec, allow-listed flags) and the
# steps run without a shell. The plan and its output are posted back to the PR.
#
# Security: only OWNER/MEMBER/COLLABORATOR comments run, never on fork PRs; the tooling comes from
# the default branch (trusted), only the Helm chart is taken from the PR.
name: ChatOps

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  packages: write
  id-token: write

concurrency:
  group: chatops-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  parse:
    if: >-
      github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/deploy-preview') ||
       startsWith(github.event.comment.body, '/teardown-preview') ||
       startsWith(github.event.comment.body, '/ai '))
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
      build: ${{ steps.pr.outputs.build }}
    steps:
      - name: Authorize and inspect the PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          ASSOCIATION: ${{ github.event.comment.author_association }}
          BODY: ${{ github.event.comment.body }}
          PR: ${{ github.event.issue.number }}
        run: |
          case "$ASSOCIATION" in OWNER|MEMBER|COLLABORATOR) ;; *)
            echo "::error::$ASSOCIATION may not run ChatOps commands"; exit 1;; esac
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")
          if [ "$(jq -r .head.repo.full_name <<<"$pr")" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::ChatOps does not run on pull requests from forks"; exit 1
          fi
          echo "head_sha=$(jq -r .head.sha <<<"$pr")" >> "$GITHUB_OUTPUT"
          case "$BODY" in /deploy-preview*) echo "build=true";; *) echo "build=false";; esac >> "$GITHUB_OUTPUT"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/${{ github.event.comment.id }}/reactions" -f content=eyes >/dev/null

  images:
    needs: parse
    if: needs.parse.outputs.build == 'true'
    uses: ./.github/workflows/build-images.yml
    with:
      push: true
      ref: ${{ needs.parse.outputs.head_sha }}
    secrets: inherit

  run:
    needs: [parse, images]
    if: always() && needs.parse.result == 'success' && needs.images.result != 'failure'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      TF_STATE_BUCKET_AWS: ${{ vars.TF_STATE_BUCKET_AWS }}
      TF_STATE_BUCKET_GCP: ${{ vars.TF_STATE_BUCKET_GCP }}
      BODY: ${{ github.event.comment.body }}
      PR: ${{ github.event.issue.number }}
      OWNER: ${{ needs.images.outputs.owner || github.repository_owner }}
      TAG: ${{ needs.images.outputs.backend_tag || 'unused' }}
    steps:
      - name: Trusted tooling (default branch)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: trusted
      - name: Chart from the PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.parse.outputs.head_sha }}
          path: pr
          sparse-checkout: deploy/helm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --quiet ./trusted/ai
      - name: Which cloud?
        id: target
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_WORKSPACE: ${{ github.workspace }}/trusted
        run: devops-ai chatops-target --comment "$BODY" --pr "$PR" --image-owner "${OWNER,,}" --image-tag "$TAG"
      - id: auth
        uses: ./trusted/.github/actions/cloud-auth
        with:
          cloud: ${{ steps.target.outputs.cloud }}
          kube-tools: "true"
          aws-deploy-role: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          gcp-workload-identity-provider: ${{ vars.GCP_WIF_PROVIDER }}
          gcp-deploy-service-account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        if: steps.auth.outputs.configured == 'true'
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.3
      - name: Connect to the non-prod cluster (previews live there)
        id: connect
        if: steps.auth.outputs.configured == 'true'
        working-directory: trusted
        run: |
          if scripts/tf.sh "${{ steps.target.outputs.cloud }}" nonprod output -json > /tmp/tf.json 2>/dev/null \
             && [ -n "$(jq -r '.cluster_name.value // empty' /tmp/tf.json)" ]; then
            eval "$(jq -r .kubeconfig_command.value /tmp/tf.json)" && echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Plan, validate and (if connected) execute
        working-directory: pr
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_WORKSPACE: ${{ github.workspace }}/trusted # cloud registry + config come from trusted code
          EXECUTE: ${{ steps.connect.outputs.ok == 'true' && '--execute' || '' }}
        run: |
          set +e
          # shellcheck disable=SC2086
          devops-ai --summary "$RUNNER_TEMP/reply.md" chatops --comment "$BODY" --pr "$PR" \
            --image-owner "${OWNER,,}" --image-tag "$TAG" --default-cloud "${{ steps.target.outputs.cloud }}" $EXECUTE
          echo "rc=$?" >> "$GITHUB_ENV"
      - name: Reply on the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s "$RUNNER_TEMP/reply.md" ] || echo "ChatOps could not produce a plan; see the [run log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)." > "$RUNNER_TEMP/reply.md"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/reply.md"
          [ "${rc:-0}" = 0 ]
