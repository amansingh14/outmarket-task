# Build pipeline: runs on every PR and on every push to an environment branch.
#
#   branch-policy  PRs must follow feature/* -> development -> staging -> qa -> preprod -> production
#   backend / frontend / ai / helm   lint + tests + chart rendering for every environment
#   images         build + Trivy scan; on push, publish content-addressed images to GHCR
#   gate           single required status check for branch protection
#
# A successful push run triggers deploy.yml for that branch's environment.
name: CI

on:
  pull_request:
  push:
    branches: [development, staging, qa, preprod, production, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  branch-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet ./ai
      - name: Promotion rules
        env:
          # via env, never inlined: branch names are attacker-controlled input
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          devops-ai delivery validate
          devops-ai delivery check-promotion --base "$BASE_REF" --head "$HEAD_REF"

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet -e '.[dev]'
      - run: ruff check .
      - run: pytest -q

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet ./ai
      - name: Lint and render the chart for every environment
        run: |
          for env in development staging qa preprod production; do
            devops-ai delivery env-values --env "$env" --out "build/$env.values.yaml"
            helm lint deploy/helm/idea-board -f "build/$env.values.yaml" \
              --set image.owner=ci --set backend.image.tag=ci --set frontend.image.tag=ci
            helm template idea-board deploy/helm/idea-board -n "$env" -f "build/$env.values.yaml" \
              --set image.owner=ci > "build/$env.rendered.yaml"
            echo "$env: $(grep -c '^kind:' "build/$env.rendered.yaml") objects"
          done

  images:
    needs: [backend, frontend]
    uses: ./.github/workflows/build-images.yml
    with:
      push: ${{ github.event_name == 'push' }}
    secrets: inherit

  gate:
    if: always()
    needs: [branch-policy, backend, frontend, ai, helm, images]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        run: |
          echo '${{ toJSON(needs) }}' | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo '${{ toJSON(needs) }}' | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' >/dev/null; then
            echo "::error::one or more CI jobs failed"; exit 1
          fi
