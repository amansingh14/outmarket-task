# CI/CD pipeline: one workflow from pull request to running environment.
#
#   every PR / push       branch policy · backend · frontend · AI + evals · charts · workflow lint ·
#                         images (build, smoke test, Trivy; push + SBOM + signature on push) · gate
#   push to env branch    resolve (config/deployments.yaml)
#                         -> infra   terraform apply for the stack this branch owns (only if infra changed)
#                         -> deploy  per cloud: helm upgrade -> AI health check -> rollback or promotion PR
#
# Deploys run here (workflow_call) rather than via workflow_run, so they use the workflow files from
# the commit being deployed, never wait on a separate trigger, and always run after infra.
name: CI

on:
  pull_request:
  push:
    branches: [development, staging, qa, preprod, production]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  pull-requests: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.f.outputs.infra }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: f
        with:
          filters: |
            infra:
              - "infra/terraform/**"
              - "config/stacks/**"
              - "config/deployments.yaml"
              - "clouds/**"

  branch-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --quiet ./ai
      - name: Promotion rules
        env:
          # via env, never inlined: branch names are attacker-controlled input
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          devops-ai delivery validate
          devops-ai delivery check-promotion --base "$BASE_REF" --head "$HEAD_REF"

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --quiet -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - name: AI evals (offline subset; the full live set runs in ai-evals.yml)
        run: devops-ai eval --offline

  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --quiet ./ai
      - name: idea-board chart, every environment
        run: |
          for env in $(devops-ai delivery validate | awk 'NR>1 {print $1}'); do
            devops-ai delivery env-values --env "$env" --out "build/$env.values.yaml"
            args=(-f "build/$env.values.yaml" --set image.owner=ci --set database.host=db.example.internal)
            helm lint deploy/helm/idea-board "${args[@]}"
            helm template idea-board deploy/helm/idea-board -n "$env" "${args[@]}" > "build/$env.rendered.yaml"
            echo "$env: $(grep -c '^kind:' "build/$env.rendered.yaml") objects"
          done
          helm template preview deploy/helm/idea-board --set database.mode=embedded --set image.owner=ci > /dev/null
      - name: microservice chart, every scaffolded service
        run: |
          helm lint deploy/helm/microservice
          for f in deploy/helm/values/services/*.yaml; do
            helm lint deploy/helm/microservice -f "$f"
            helm template "$(basename "$f" .yaml)" deploy/helm/microservice -f "$f" > /dev/null
            echo "ok: $f"
          done

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.4 -color
      - name: Every action is pinned to a full commit SHA
        run: |
          refs=$(grep -rhoE 'uses: [A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+@[^ ]+' .github || true)
          bad=$(echo "$refs" | grep -vE '@[0-9a-f]{40}$' || true)
          if [ -n "$bad" ]; then echo "::error::unpinned actions:"; echo "$bad"; exit 1; fi
          echo "all $(echo "$refs" | wc -l | tr -d ' ') third-party action references are SHA-pinned"

  images:
    needs: [backend, frontend]
    uses: ./.github/workflows/build-images.yml
    with:
      push: ${{ github.event_name == 'push' }}
    secrets: inherit

  gate:
    if: always()
    needs: [changes, branch-policy, backend, frontend, ai, charts, workflows, images]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' >/dev/null; then
            echo "::error::one or more CI jobs failed"; exit 1
          fi

  # ------------------------------------------------------------------ CD
  resolve:
    needs: gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.r.outputs.environment }}
      apply_stack: ${{ steps.r.outputs.apply_stack }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --quiet ./ai
      - id: r
        run: devops-ai delivery resolve --branch "$GITHUB_REF_NAME"

  infra:
    needs: [changes, resolve]
    if: needs.resolve.outputs.apply_stack != '' && needs.changes.outputs.infra == 'true'
    uses: ./.github/workflows/infra.yml
    with:
      stack: ${{ needs.resolve.outputs.apply_stack }}
      action: apply
    secrets: inherit

  deploy:
    needs: [resolve, images, infra]
    if: >-
      always() && needs.resolve.outputs.environment != '' && needs.images.result == 'success' &&
      (needs.infra.result == 'success' || needs.infra.result == 'skipped')
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ needs.resolve.outputs.environment }}
      ref: ${{ github.sha }}
    secrets: inherit
