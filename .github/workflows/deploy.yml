# Deployment pipeline for one environment (called by CI after a push, or run by hand).
#
#   resolve  environment -> clouds, stack, namespace, next branch (config/deployments.yaml)
#   images   make sure the content-addressed images exist (reuses CI's; builds only if missing)
#   deploy   per cloud, inside the GitHub Environment of the same name (approvals on preprod/
#            production): scripts/deploy.sh = stack outputs -> kubeconfig -> DB admin secret ->
#            baseline -> helm upgrade (provision + migrate hooks) -> AI health check -> rollback
#   promote  open/update the PR to the next branch, or the back-merge PR after a hotfix
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      ref:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to (re)deploy; run from that environment's branch
        type: choice
        options: [development, staging, qa, preprod, production]
      ref:
        description: Commit SHA to deploy (default = tip of the selected branch)
        type: string
        default: ""

permissions:
  contents: read
  packages: write
  id-token: write
  pull-requests: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.r.outputs.environment }}
      branch: ${{ steps.r.outputs.branch }}
      matrix: ${{ steps.r.outputs.matrix }}
      promote_to: ${{ steps.r.outputs.promote_to }}
      backmerge_to: ${{ steps.r.outputs.backmerge_to }}
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: pin
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --quiet ./ai
      - id: r
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: devops-ai delivery resolve --environment "$ENVIRONMENT"
      - name: Summary
        run: |
          echo "## 🚀 Deploy \`${{ steps.r.outputs.environment }}\` @ \`${{ steps.pin.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "stack \`${{ steps.r.outputs.stack }}\` · next: \`${{ steps.r.outputs.promote_to || steps.r.outputs.backmerge_to || '–' }}\`" >> "$GITHUB_STEP_SUMMARY"

  images:
    needs: resolve
    uses: ./.github/workflows/build-images.yml
    with:
      push: true
      ref: ${{ needs.resolve.outputs.sha }}
    secrets: inherit

  deploy:
    name: deploy (${{ matrix.environment }} / ${{ matrix.cloud }})
    needs: [resolve, images]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    environment:
      name: ${{ matrix.environment }}
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-${{ matrix.environment }}-${{ matrix.cloud }}
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      TF_STATE_BUCKET_AWS: ${{ vars.TF_STATE_BUCKET_AWS }}
      TF_STATE_BUCKET_GCP: ${{ vars.TF_STATE_BUCKET_GCP }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --quiet ./ai
      - name: Required variables for ${{ matrix.cloud }}
        id: vars
        env:
          REPO_VARS: ${{ toJSON(vars) }}
        run: |
          missing=""
          for v in $(devops-ai delivery clouds --cloud "${{ matrix.cloud }}" --purpose deploy | sed -n 's/^vars=//p'); do
            [ -n "$(jq -r --arg v "$v" '.[$v] // empty' <<<"$REPO_VARS")" ] || missing="$missing $v"
          done
          echo "missing=${missing# }" >> "$GITHUB_OUTPUT"
      - id: auth
        uses: ./.github/actions/cloud-auth
        with:
          cloud: ${{ matrix.cloud }}
          kube-tools: "true"
          aws-deploy-role: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          gcp-workload-identity-provider: ${{ vars.GCP_WIF_PROVIDER }}
          gcp-deploy-service-account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Not configured
        if: steps.vars.outputs.missing != '' || steps.auth.outputs.configured != 'true'
        run: |
          mkdir -p result
          why="not configured (set repository variables: ${{ steps.vars.outputs.missing }})"
          echo "### ⏭️ ${{ matrix.cloud }} skipped: $why" >> "$GITHUB_STEP_SUMMARY"
          jq -n --arg c "${{ matrix.cloud }}" --arg why "$why" '{cloud: $c, status: "skipped", reason: $why}' > "result/${{ matrix.cloud }}.json"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        if: steps.vars.outputs.missing == '' && steps.auth.outputs.configured == 'true'
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        if: steps.vars.outputs.missing == '' && steps.auth.outputs.configured == 'true'
        with:
          version: v3.16.3
      - name: scripts/deploy.sh ${{ matrix.environment }} ${{ matrix.cloud }}
        id: deploy
        if: steps.vars.outputs.missing == '' && steps.auth.outputs.configured == 'true'
        env:
          IMAGE_OWNER: ${{ needs.images.outputs.owner }}
          BACKEND_TAG: ${{ needs.images.outputs.backend_tag }}
          FRONTEND_TAG: ${{ needs.images.outputs.frontend_tag }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESULT_FILE: result/${{ matrix.cloud }}.json
        run: |
          mkdir -p result
          scripts/deploy.sh "${{ matrix.environment }}" "${{ matrix.cloud }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: deploy-${{ matrix.environment }}-${{ matrix.cloud }}
          path: result/

  promote:
    needs: [resolve, deploy]
    if: needs.resolve.outputs.promote_to != '' || needs.resolve.outputs.backmerge_to != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # PRs opened with GITHUB_TOKEN don't trigger CI; a PAT/App token makes promotion PRs testable.
          token: ${{ secrets.PROMOTION_TOKEN || github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: deploy-*
          merge-multiple: true
          path: results
      - name: Open or update promotion PR
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_TOKEN || github.token }}
          ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
          HEAD: ${{ needs.resolve.outputs.branch }}
          BASE: ${{ needs.resolve.outputs.promote_to || needs.resolve.outputs.backmerge_to }}
          KIND: ${{ needs.resolve.outputs.promote_to && 'promote' || 'back-merge' }}
        run: |
          git fetch origin "$BASE" "$HEAD"
          if git diff --quiet "origin/$BASE...origin/$HEAD"; then
            echo "nothing in \`$HEAD\` that \`$BASE\` lacks; no PR needed" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          deployed=$(jq -s '[.[] | select(.status == "deployed")] | length' results/*.json)
          total=$(jq -s 'length' results/*.json)
          {
            if [ "$KIND" = promote ] && [ "$deployed" = "$total" ]; then
              echo "Promote **\`$HEAD\`** → **\`$BASE\`**. \`$ENVIRONMENT\` was deployed to all $total cloud(s) and passed its health check."
            elif [ "$KIND" = promote ]; then
              echo "Promote **\`$HEAD\`** → **\`$BASE\`**."
              echo
              echo "> [!WARNING]"
              echo "> \`$ENVIRONMENT\` was deployed to only $deployed of $total cloud(s); the rest were skipped (see the table). CI passed, but this change has **not** been verified in a running \`$ENVIRONMENT\` environment."
            else
              echo "Back-merge **\`$HEAD\`** → **\`$BASE\`** so the production hotfix isn't lost on the next release."
            fi
            echo
            echo "### \`$ENVIRONMENT\` deployment"
            echo "| Cloud | Status | Health | URL | backend | frontend |"
            echo "|---|---|---|---|---|---|"
            for f in results/*.json; do
              jq -r '"| \(.cloud) | \(.status) | \(.verdict // "–") | \(.url // .reason // "–") | `\(.backend // "–")` | `\(.frontend // "–")` |"' "$f"
            done
            echo
            echo "### Changes"
            git log --no-merges --format='- %s (%h, %an)' "origin/$BASE..origin/$HEAD" | head -50
            echo
            echo "_Images are content-addressed: what was tested in \`$ENVIRONMENT\` is exactly what \`$BASE\` will run._"
            echo "_Opened by the [deploy pipeline](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})._"
          } > body.md
          title="$( [ "$KIND" = promote ] && echo "Promote $HEAD → $BASE" || echo "Back-merge $HEAD → $BASE" )"
          existing=$(gh pr list --base "$BASE" --head "$HEAD" --state open --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body-file body.md
            echo "updated PR #$existing" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            gh pr create --base "$BASE" --head "$HEAD" --title "$title" --body-file body.md --label promotion \
              || gh pr create --base "$BASE" --head "$HEAD" --title "$title" --body-file body.md
            echo "opened promotion PR $HEAD → $BASE" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
