# Tear down an infrastructure stack with Terraform (manual only).
#
#   resolve  typed confirmation + deletion-protection opt-in -> clouds to destroy
#   plan     per cloud: `terraform plan -destroy`; the resource list goes to the run summary
#   destroy  per cloud, inside the GitHub Environment `infra-<stack>` (required reviewers on
#            preprod/production): scripts/destroy.sh apply = drain the cluster's load balancers and
#            volumes -> lift deletion protection if set (AWS: final RDS snapshot first) -> apply the
#            reviewed destroy plan -> retry leftovers -> verify the state is empty
#
# The Terraform state buckets and the CI identities (OIDC roles / workload identity) are not managed
# by these stacks and are kept, so the Infrastructure workflow can recreate the stack later.
name: Destroy

on:
  workflow_dispatch:
    inputs:
      stack:
        type: choice
        options: [nonprod, preprod, production]
      cloud:
        description: Cloud to destroy the stack on
        type: choice
        options: [all, aws, gcp]
        default: all
      confirm:
        description: Type the stack name again to confirm
        type: string
        required: true
      lift_deletion_protection:
        description: Required for stacks with deletion_protection (preprod, production); the database is deleted
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

# Same group as the Infrastructure workflow: never destroy while an apply runs on this stack.
concurrency:
  group: infra-${{ inputs.stack }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
  TF_STATE_BUCKET_AWS: ${{ vars.TF_STATE_BUCKET_AWS }}
  TF_STATE_BUCKET_GCP: ${{ vars.TF_STATE_BUCKET_GCP }}
  TF_VAR_admin_principal_arns: ${{ vars.EKS_ADMIN_PRINCIPAL_ARNS || '[]' }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      clouds: ${{ steps.r.outputs.clouds }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --quiet ./ai
      - id: r
        env:
          STACK: ${{ inputs.stack }}
          CLOUD: ${{ inputs.cloud }}
          CONFIRM: ${{ inputs.confirm }}
          LIFT: ${{ inputs.lift_deletion_protection }}
        run: |
          [ "$CONFIRM" = "$STACK" ] || { echo "::error::confirmation '$CONFIRM' does not match stack '$STACK'"; exit 1; }
          protected=$(python3 -c 'import sys,yaml; print(str(yaml.safe_load(open(sys.argv[1])).get("deletion_protection", False)).lower())' "config/stacks/$STACK.yaml")
          if [ "$protected" = true ] && [ "$LIFT" != true ]; then
            echo "::error::stack '$STACK' has deletion_protection; re-run with lift_deletion_protection checked"; exit 1
          fi
          # Every cloud plugin, not only the clouds deployments.yaml uses today: a cloud removed from
          # an environment may still hold resources. Clouds with empty state are no-ops.
          all=$(devops-ai delivery clouds | sed -n 's/^clouds=//p')
          if [ "$CLOUD" = all ]; then clouds=$all
          else
            jq -e --arg c "$CLOUD" 'index($c)' <<<"$all" >/dev/null || { echo "::error::no cloud plugin '$CLOUD'"; exit 1; }
            clouds=$(jq -cn --arg c "$CLOUD" '[$c]')
          fi
          echo "clouds=$clouds" >> "$GITHUB_OUTPUT"
          echo "## 🧨 Destroy \`$STACK\` on $(jq -r 'join(", ")' <<<"$clouds")" >> "$GITHUB_STEP_SUMMARY"

  plan:
    name: plan destroy (${{ inputs.stack }} / ${{ matrix.cloud }})
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cloud: ${{ fromJSON(needs.resolve.outputs.clouds) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --quiet ./ai
      - id: auth
        uses: ./.github/actions/cloud-auth
        with:
          cloud: ${{ matrix.cloud }}
          aws-deploy-role: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          gcp-workload-identity-provider: ${{ vars.GCP_WIF_PROVIDER }}
          gcp-deploy-service-account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - id: ready
        env:
          REPO_VARS: ${{ toJSON(vars) }}
        run: |
          missing=""
          for v in $(devops-ai delivery clouds --cloud "${{ matrix.cloud }}" --purpose deploy | sed -n 's/^vars=//p'); do
            [ -n "$(jq -r --arg v "$v" '.[$v] // empty' <<<"$REPO_VARS")" ] || missing="$missing $v"
          done
          if [ -z "$missing" ] && [ "${{ steps.auth.outputs.configured }}" = true ]; then ok=true; else ok=false
            echo "### ⏭️ ${{ matrix.cloud }} not configured; skipping (missing:${missing:- identity})" >> "$GITHUB_STEP_SUMMARY"
            mkdir -p "build/${{ inputs.stack }}" && touch "build/${{ inputs.stack }}/${{ matrix.cloud }}.skip"
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        if: steps.ready.outputs.ok == 'true'
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - name: terraform plan -destroy
        if: steps.ready.outputs.ok == 'true'
        run: scripts/destroy.sh "${{ matrix.cloud }}" "${{ inputs.stack }}" plan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: destroy-${{ inputs.stack }}-${{ matrix.cloud }}
          path: build/${{ inputs.stack }}/
          retention-days: 5

  destroy:
    name: destroy (${{ inputs.stack }} / ${{ matrix.cloud }})
    needs: [resolve, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 120 # EKS + RDS teardown is ~20-30 min; the AWS deploy session lasts 2 h
    strategy:
      fail-fast: false # the clouds are independent; a failure on one must not strand the other half-done
      matrix:
        cloud: ${{ fromJSON(needs.resolve.outputs.clouds) }}
    environment: infra-${{ inputs.stack }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: destroy-${{ inputs.stack }}-${{ matrix.cloud }}
          path: build/${{ inputs.stack }}/
      - id: todo
        run: |
          d="build/${{ inputs.stack }}"
          if [ -f "$d/${{ matrix.cloud }}.skip" ]; then echo "${{ matrix.cloud }} not configured; skipped"; run=false
          elif [ ! -s "$d/${{ matrix.cloud }}.destroy-reviewed.txt" ]; then echo "nothing to destroy on ${{ matrix.cloud }}"; run=false
          else run=true; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.todo.outputs.run == 'true'
        with:
          python-version: "3.12"
      - if: steps.todo.outputs.run == 'true'
        run: pip install --quiet ./ai
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        if: steps.todo.outputs.run == 'true'
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        if: steps.todo.outputs.run == 'true'
        with:
          version: v3.16.3
      - uses: ./.github/actions/cloud-auth
        if: steps.todo.outputs.run == 'true'
        with:
          cloud: ${{ matrix.cloud }}
          kube-tools: "true"
          aws-deploy-role: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          gcp-workload-identity-provider: ${{ vars.GCP_WIF_PROVIDER }}
          gcp-deploy-service-account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: scripts/destroy.sh ${{ matrix.cloud }} ${{ inputs.stack }} apply
        if: steps.todo.outputs.run == 'true'
        run: scripts/destroy.sh "${{ matrix.cloud }}" "${{ inputs.stack }}" apply
