# Infrastructure pipeline: terraform plan -> AI risk review + destructive gate -> approved apply.
#
#   push to development  -> nonprod stack    (shared by development, staging, qa)  AWS
#   push to preprod      -> preprod stack                                          AWS + GCP
#   push to production   -> production stack                                       AWS + GCP
#   manual run           -> any stack, plan only or plan + apply
#
# Applies run inside the GitHub Environment `infra-<stack>`; give infra-preprod and
# infra-production required reviewers so nobody applies to them without approval.
name: Infrastructure

on:
  push:
    branches: [development, preprod, production]
    paths:
      - "infra/terraform/**"
      - "config/environments/**"
      - "config/deployments.yaml"
  workflow_dispatch:
    inputs:
      stack:
        type: choice
        options: [nonprod, preprod, production]
      action:
        type: choice
        options: [plan, apply]
        default: plan
      allow_destructive:
        description: Allow plans that delete/replace databases, clusters or networks
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-${{ inputs.stack || github.ref_name }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  TF_STATE_BUCKET_AWS: ${{ vars.TF_STATE_BUCKET_AWS }}
  TF_STATE_BUCKET_GCP: ${{ vars.TF_STATE_BUCKET_GCP }}
  TF_VAR_admin_principal_arns: ${{ vars.EKS_ADMIN_PRINCIPAL_ARNS || '[]' }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      stack: ${{ steps.r.outputs.stack }}
      matrix: ${{ steps.r.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet ./ai
      - id: r
        run: devops-ai delivery infra --branch "${{ github.ref_name }}" --stack "${{ inputs.stack }}"

  plan:
    name: plan (${{ matrix.stack }} / ${{ matrix.cloud }})
    needs: resolve
    if: needs.resolve.outputs.stack != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    outputs:
      configured: ${{ steps.cfg.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
      - id: cfg
        run: |
          if [ "${{ matrix.cloud }}" = aws ]; then
            [ -n "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ] && [ -n "$TF_STATE_BUCKET_AWS" ] && ok=true || ok=false
          else
            [ -n "${{ vars.GCP_WIF_PROVIDER }}" ] && [ -n "$TF_STATE_BUCKET_GCP" ] && [ -n "$GCP_PROJECT_ID" ] && ok=true || ok=false
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          [ "$ok" = true ] || echo "### ⏭️ ${{ matrix.cloud }} not configured; skipping plan (see docs/delivery.md)" >> "$GITHUB_STEP_SUMMARY"
      - uses: hashicorp/setup-terraform@v3
        if: steps.cfg.outputs.ok == 'true'
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ok == 'true'
        with:
          python-version: "3.12"
      - run: pip install --quiet ./ai
        if: steps.cfg.outputs.ok == 'true'
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.cfg.outputs.ok == 'true' && matrix.cloud == 'aws'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: google-github-actions/auth@v2
        if: steps.cfg.outputs.ok == 'true' && matrix.cloud == 'gcp'
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: terraform plan
        if: steps.cfg.outputs.ok == 'true'
        run: scripts/tf.sh "${{ matrix.cloud }}" "${{ matrix.stack }}" plan
      - name: AI plan review + destructive-change gate
        if: steps.cfg.outputs.ok == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          devops-ai review-plan --plan "build/${{ matrix.stack }}/${{ matrix.cloud }}.plan.json" \
            --cloud "${{ matrix.cloud }}" --env "${{ matrix.stack }}" \
            ${{ inputs.allow_destructive && '--allow-destructive' || '' }}
      - uses: actions/upload-artifact@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          name: tfplan-${{ matrix.stack }}-${{ matrix.cloud }}
          path: build/${{ matrix.stack }}/
          retention-days: 5

  apply:
    name: apply (${{ matrix.stack }} / ${{ matrix.cloud }})
    needs: [resolve, plan]
    if: >-
      needs.plan.outputs.configured == 'true' &&
      (github.event_name == 'push' || inputs.action == 'apply')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1 # one cloud at a time; a broken apply stops before touching the second cloud
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    environment: infra-${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet ./ai
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.stack }}-${{ matrix.cloud }}
          path: build/${{ matrix.stack }}/
      - uses: aws-actions/configure-aws-credentials@v4
        if: matrix.cloud == 'aws'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: google-github-actions/auth@v2
        if: matrix.cloud == 'gcp'
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: terraform apply (the reviewed plan, nothing else)
        run: scripts/tf.sh "${{ matrix.cloud }}" "${{ matrix.stack }}" apply
