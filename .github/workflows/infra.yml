# Infrastructure pipeline: terraform plan -> AI risk review + destructive gate -> approved apply.
#
# Called by CI when a push to development / preprod / production changes infrastructure (that branch
# owns the nonprod / preprod / production stack), or run by hand for any stack.
# Applies run inside the GitHub Environment `infra-<stack>`; infra-preprod and infra-production
# carry required reviewers, so nobody applies to them without approval.
name: Infrastructure

on:
  workflow_call:
    inputs:
      stack:
        type: string
        required: true
      action:
        type: string
        default: apply
  workflow_dispatch:
    inputs:
      stack:
        type: choice
        options: [nonprod, preprod, production]
      action:
        type: choice
        options: [plan, apply]
        default: plan
      allow_destructive:
        description: Allow plans that delete/replace databases, clusters or networks
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-${{ inputs.stack }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
  TF_STATE_BUCKET_AWS: ${{ vars.TF_STATE_BUCKET_AWS }}
  TF_STATE_BUCKET_GCP: ${{ vars.TF_STATE_BUCKET_GCP }}
  TF_VAR_admin_principal_arns: ${{ vars.EKS_ADMIN_PRINCIPAL_ARNS || '[]' }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.r.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --quiet ./ai
      - id: r
        env:
          STACK: ${{ inputs.stack }}
        run: devops-ai delivery infra --stack "$STACK"

  plan:
    name: plan (${{ matrix.stack }} / ${{ matrix.cloud }})
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    outputs:
      configured: ${{ steps.ready.outputs.ok }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --quiet ./ai
      - id: auth
        uses: ./.github/actions/cloud-auth
        with:
          cloud: ${{ matrix.cloud }}
          aws-deploy-role: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          gcp-workload-identity-provider: ${{ vars.GCP_WIF_PROVIDER }}
          gcp-deploy-service-account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - id: ready
        env:
          REPO_VARS: ${{ toJSON(vars) }}
        run: |
          missing=""
          for v in $(devops-ai delivery clouds --cloud "${{ matrix.cloud }}" --purpose deploy | sed -n 's/^vars=//p'); do
            [ -n "$(jq -r --arg v "$v" '.[$v] // empty' <<<"$REPO_VARS")" ] || missing="$missing $v"
          done
          if [ -z "$missing" ] && [ "${{ steps.auth.outputs.configured }}" = true ]; then ok=true; else ok=false
            echo "### ⏭️ ${{ matrix.cloud }} not configured; skipping (missing:${missing:- identity})" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        if: steps.ready.outputs.ok == 'true'
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - name: terraform plan
        if: steps.ready.outputs.ok == 'true'
        run: scripts/tf.sh "${{ matrix.cloud }}" "${{ matrix.stack }}" plan
      - name: AI plan review + destructive-change gate
        if: steps.ready.outputs.ok == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          devops-ai review-plan --plan "build/${{ matrix.stack }}/${{ matrix.cloud }}.plan.json" \
            --cloud "${{ matrix.cloud }}" --stack "${{ matrix.stack }}" \
            ${{ inputs.allow_destructive && '--allow-destructive' || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.ready.outputs.ok == 'true'
        with:
          name: tfplan-${{ matrix.stack }}-${{ matrix.cloud }}
          path: build/${{ matrix.stack }}/
          retention-days: 5

  apply:
    name: apply (${{ matrix.stack }} / ${{ matrix.cloud }})
    needs: [resolve, plan]
    if: needs.plan.outputs.configured == 'true' && inputs.action == 'apply'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1 # one cloud at a time; a broken apply stops before touching the next cloud
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    environment: infra-${{ matrix.stack }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --quiet ./ai
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tfplan-${{ matrix.stack }}-${{ matrix.cloud }}
          path: build/${{ matrix.stack }}/
      - uses: ./.github/actions/cloud-auth
        with:
          cloud: ${{ matrix.cloud }}
          aws-deploy-role: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          gcp-workload-identity-provider: ${{ vars.GCP_WIF_PROVIDER }}
          gcp-deploy-service-account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: terraform apply (the reviewed plan, nothing else)
        run: scripts/tf.sh "${{ matrix.cloud }}" "${{ matrix.stack }}" apply
