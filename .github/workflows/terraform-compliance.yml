# Terraform compliance gate.
#
#   changes       did this PR touch infrastructure or policies?
#   matrix        (cloud, stack) pairs actually deployed, from config/deployments.yaml
#   validate      terraform fmt -check, init, validate per cloud root
#   policy-tests  opa test on the Rego policies themselves
#   policy        scripts/policy-check.sh per (cloud, stack): full-state plan -> conftest (OPA)
#   report        one sticky PR comment with every control; fails the check if anything blocks
#
# Runs on every PR so "report" can be a required check (a path-filtered workflow would never
# report on app-only PRs and block them forever); the heavy jobs only run when infra changed.
name: Terraform compliance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # sticky report comment
  id-token: write # OIDC to the read-only plan identities

concurrency:
  group: tf-compliance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.12.2
  OPA_VERSION: 1.0.0
  CONFTEST_VERSION: 0.56.0
  TF_IN_AUTOMATION: "1"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.f.outputs.infra }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: f
        if: github.event_name == 'pull_request'
        with:
          filters: |
            infra:
              - "infra/terraform/**"
              - "policy/**"
              - "clouds/**"
              - "config/stacks/**"
              - "config/deployments.yaml"
              - "scripts/policy_report.py"
              - "scripts/policy-check.sh"
              - ".github/workflows/terraform-compliance.yml"

  matrix:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      columns: ${{ steps.m.outputs.columns }}
      clouds: ${{ steps.c.outputs.clouds }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --quiet ./ai
      - id: m
        run: devops-ai delivery compliance-matrix
      - id: c
        run: devops-ai delivery clouds

  validate:
    name: validate (${{ matrix.cloud }})
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cloud: ${{ fromJSON(needs.matrix.outputs.clouds) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: fmt / init / validate
        run: |
          mkdir -p results
          root=$(python3 -c 'import sys,yaml; print(yaml.safe_load(open(sys.argv[1]))["terraform_root"])' "clouds/${{ matrix.cloud }}/cloud.yaml")
          fmt=pass;  terraform fmt -check -recursive -diff infra/terraform || fmt=fail
          init=pass; terraform -chdir="$root" init -backend=false -input=false -no-color || init=fail
          if [ "$init" = pass ]; then
            terraform -chdir="$root" validate -json -no-color > /tmp/validate.json || true
          else
            echo '{"valid": false, "diagnostics": [{"severity": "error", "summary": "terraform init failed"}]}' > /tmp/validate.json
          fi
          jq -n --arg c "${{ matrix.cloud }}" --arg fmt "$fmt" --arg init "$init" --slurpfile v /tmp/validate.json \
            '{cloud: $c, fmt: $fmt, init: $init, validate: $v[0]}' > "results/validate-${{ matrix.cloud }}.json"
          cat "results/validate-${{ matrix.cloud }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: results-validate-${{ matrix.cloud }}
          path: results/

  policy-tests:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: ${{ env.OPA_VERSION }}
      - name: opa fmt / check / test
        run: |
          mkdir -p results
          status=pass
          out=$( { opa fmt --fail --list policy/ && opa check --strict policy/terraform policy/data \
                   && opa test policy/terraform policy/data -v; } 2>&1 ) || status=fail
          echo "$out"
          jq -n --arg s "$status" --arg o "$out" '{status: $s, output: $o}' > results/opa-test.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: results-opa-test
          path: results/

  policy:
    name: policy (${{ matrix.cloud }}/${{ matrix.stack }})
    needs: [matrix, validate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'policy-check-placeholder' }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER || '000000000000' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install conftest and devops-ai
        run: |
          curl -sSfL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar xz -C /usr/local/bin conftest
          pip install --quiet ./ai
          mkdir -p results
      - uses: ./.github/actions/cloud-auth
        with:
          cloud: ${{ matrix.cloud }}
          purpose: plan
          aws-plan-role: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          gcp-workload-identity-provider: ${{ vars.GCP_WIF_PROVIDER }}
          gcp-plan-service-account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
      - name: scripts/policy-check.sh ${{ matrix.cloud }} ${{ matrix.stack }}
        run: |
          C=${{ matrix.cloud }}; S=${{ matrix.stack }}
          status() { jq -n --arg s "$1" --arg r "$2" '{status: $s, reason: $r}' > "results/status-$C-$S.json"; }
          # Steps run under `bash -e`; capture the exit code instead of letting it abort the step.
          rc=0
          scripts/policy-check.sh "$C" "$S" --json-out "results/conftest-$C-$S.json" 2>plan.err || rc=$?
          case $rc in
            0|1) echo "evaluated (rc=$rc; the report job decides)";;
            3) rm -f "results/conftest-$C-$S.json"; status skipped "$(tail -1 plan.err) (set the plan identity for $C)";;
            *) rm -f "results/conftest-$C-$S.json"; tail -30 plan.err; status plan_failed "$(grep -m1 -E 'Error' plan.err | cut -c1-200)"; exit 1;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: results-policy-${{ matrix.cloud }}-${{ matrix.stack }}
          path: results/

  report:
    needs: [changes, matrix, validate, policy-tests, policy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: No infrastructure changes
        if: needs.changes.outputs.infra != 'true'
        run: echo "No Terraform/policy changes in this PR; compliance check not needed." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.changes.outputs.infra == 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.changes.outputs.infra == 'true'
        with:
          pattern: results-*
          merge-multiple: true
          path: results
      - name: Build report
        id: report
        if: needs.changes.outputs.infra == 'true'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COLUMNS_LIST: ${{ needs.matrix.outputs.columns }}
        run: |
          pip install --quiet pyyaml
          set +e
          python3 scripts/policy_report.py --results results --columns "$COLUMNS_LIST" --out report.md
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post / update PR comment
        if: needs.changes.outputs.infra == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: terraform-compliance
          path: report.md
      - name: Enforce
        if: needs.changes.outputs.infra == 'true' && steps.report.outputs.exit != '0'
        run: |
          echo "::error::Terraform compliance check failed. See the PR comment or job summary."
          exit 1
