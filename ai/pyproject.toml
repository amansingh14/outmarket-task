[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-ai"
version = "1.0.0"
description = "AI copilots for the Idea Board delivery pipeline (Claude-powered, guardrailed)."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.6.0",
  "pydantic>=2.8",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Pinned so CI lints with the same rules as local runs (newer ruff releases widen the defaults).
dev = ["pytest==8.3.4", "ruff==0.8.4"]

[project.scripts]
devops-ai = "devops_ai.cli:main"

[tool.setuptools]
packages = ["devops_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
