{{- $c := dict "root" . "component" "backend" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ib.fullname" . }}-backend
  labels:
    {{- include "ib.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      {{- include "ib.selector" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ib.labels" . | nindent 8 }}
        {{- include "ib.selector" $c | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      {{- include "ib.pullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: backend
          image: {{ include "ib.image" $c }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8000 }
          env:
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.backend.logLevel | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ib.dbSecretName" . }}
                  key: DATABASE_URL
            {{- if eq .Values.database.mode "embedded" }}
            # Embedded previews: the database is created by this release, so migrate at startup.
            - name: RUN_MIGRATIONS
              value: "true"
            {{- end }}
          readinessProbe:
            httpGet: { path: /api/ready, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 3
            failureThreshold: 40
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ib.fullname" . }}-backend
  labels:
    {{- include "ib.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ib.selector" $c | nindent 4 }}
  ports:
    - { name: http, port: 8000, targetPort: http }
{{- if .Values.backend.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ib.fullname" . }}-backend
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ include "ib.fullname" . }}-backend }
  minReplicas: {{ .Values.backend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.backend.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.backend.autoscaling.targetCPUUtilizationPercentage }} }
{{- end }}
{{- /* A PDB is only useful when a pod can be evicted while others keep serving. With one
     replica and minAvailable 1 it allows zero disruptions, so node drains (EKS/GKE version
     upgrades) can never finish. Render it only when the minimum replica count exceeds it. */}}
{{- $minPods := ternary .Values.backend.autoscaling.minReplicas .Values.backend.replicas .Values.backend.autoscaling.enabled }}
{{- if and .Values.podDisruptionBudget.enabled (gt (int $minPods) (int .Values.podDisruptionBudget.minAvailable)) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ib.fullname" . }}-backend
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "ib.selector" $c | nindent 6 }}
{{- end }}
