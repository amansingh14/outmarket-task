# Cloud-neutral defaults. Per-environment overrides are rendered by
# `devops-ai delivery env-values --env <env>` (stack sizing + config/deployments.yaml).
environment: ""                 # logical environment (development, staging, ...); set by the pipeline

image:
  registry: ghcr.io
  owner: CHANGE_ME              # GitHub org/user; set by the pipeline
  tag: latest                   # fallback when a component has no tag of its own
  pullPolicy: IfNotPresent
  pullSecrets: []               # e.g. [ghcr-pull] when packages are private

backend:
  image:
    tag: ""                     # content-addressed tag from CI (src-<tree hash>)
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  logLevel: INFO

frontend:
  image:
    tag: ""
  replicas: 2
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  service:
    # LoadBalancer works identically on EKS (NLB/CLB) and GKE (Network LB),
    # so no cloud-specific ingress controller is required for public access.
    type: LoadBalancer
    port: 80
    annotations: {}

podDisruptionBudget:
  enabled: true
  minAvailable: 1

database:
  # external: managed DB (RDS / Cloud SQL). The pipeline puts the *admin* URL in `adminSecret`;
  #           a provisioning hook creates this environment's own login + database, and the app
  #           only ever receives that least-privilege login (chart-managed Secret <release>-db).
  # embedded: throwaway Postgres in-cluster (PR preview environments).
  mode: external
  name: ideas                    # this environment's database
  createDatabase: false          # true on the shared non-prod instance
  appUser: ""                    # default: <name>_app
  host: ""                       # from Terraform outputs (scripts/deploy.sh)
  port: 5432
  sslmode: require
  adminSecret: idea-board-db-admin
  adminSecretKey: ADMIN_DATABASE_URL
  embedded:
    image: postgres:16-alpine
    storage: 1Gi

# Alembic migrations: a pre-install/pre-upgrade hook Job (external DB); embedded previews migrate
# at backend startup instead, because their database is created by this same release.
migrations:
  enabled: true

# Ingress/egress NetworkPolicies (enforced by EKS VPC CNI / GKE Dataplane V2):
#   frontend <- anyone on 8080; frontend -> backend only
#   backend  <- frontend only;  backend  -> PostgreSQL (5432) only
networkPolicy:
  enabled: true
