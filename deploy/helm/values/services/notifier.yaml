# Generated by `devops-ai scaffold-service` (offline template) from services/notifier.yaml.
# Deploy with: helm upgrade --install notifier deploy/helm/microservice -f <this file>
# Rationale: Offline template defaults.
nameOverride: notifier
image:
  repository: ghcr.io/amansingh14/idea-board-notifier
  tag: latest
replicas: 1
containerPort: 9000
env:
- name: LOG_LEVEL
  value: INFO
- name: PORT
  value: '9000'
- name: IDEAS_API_URL
  value: http://idea-board-backend:8000
database:
  enabled: false
  existingSecret: idea-board-db
  secretKey: DATABASE_URL
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
readinessProbe:
  path: /healthz
  initialDelaySeconds: 3
  periodSeconds: 5
livenessProbe:
  path: /healthz
  initialDelaySeconds: 10
  periodSeconds: 10
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
service:
  type: ClusterIP
  port: 80
podDisruptionBudget:
  minAvailable: 0
